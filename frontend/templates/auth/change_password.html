{% extends "layouts/base.html" %}


{% block title %}
Change Password | MediLens
{% endblock %}


{% block css %}

<style>
    .password-page {
        max-width: 520px;
        margin: 70px auto;
        padding: 20px;
    }

    .password-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .password-header .icon {
        width: 70px;
        height: 70px;

        margin: 0 auto 20px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(37, 99, 235, 0.15);

        color: #4f8cff;

        font-size: 28px;
    }

    .password-header h1 {
        margin-bottom: 10px;
    }

    .password-header p {
        opacity: 0.7;
        line-height: 1.6;
    }

    .password-card {
        padding: 30px;

        border-radius: 20px;

        background: rgba(255, 255, 255, 0.05);

        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;

        margin-bottom: 8px;

        font-weight: 600;
    }

    .password-input {
        position: relative;
    }

    .password-input input {
        width: 100%;

        box-sizing: border-box;

        padding: 13px 45px 13px 15px;

        border-radius: 10px;

        border: 1px solid rgba(255, 255, 255, 0.15);

        background: rgba(255, 255, 255, 0.05);

        color: inherit;

        outline: none;
    }

    .password-input input:focus {
        border-color: #2563eb;
    }

    .password-toggle {
        position: absolute;

        right: 15px;
        top: 50%;

        transform: translateY(-50%);

        border: none;

        background: none;

        color: inherit;

        cursor: pointer;
    }

    .password-btn {
        width: 100%;

        border: none;

        padding: 13px;

        border-radius: 10px;

        background: #2563eb;

        color: white;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;
    }

    .password-btn:hover {
        opacity: 0.9;
    }

    .back-account {
        display: block;

        text-align: center;

        margin-top: 20px;

        color: #4f8cff;

        text-decoration: none;
    }
</style>

{% endblock %}


{% block content %}

<div class="password-page">

    <div class="password-header">

        <div class="icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>
            Change Password
        </h1>

        <p>
            Update your MediLens account password.
        </p>

    </div>


    <div class="password-card">

        <form method="POST" action="{{ url_for('auth.change_password') }}">

            <!-- Current Password -->

            <div class="form-group">

                <label for="current_password">
                    Current Password
                </label>

                <div class="password-input">

                    <input type="password" id="current_password" name="current_password"
                        placeholder="Enter current password" required autocomplete="current-password">

                    <button type="button" class="password-toggle" onclick="togglePassword('current_password', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>


            <!-- New Password -->

            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <div class="password-input">

                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password"
                        required minlength="8" autocomplete="new-password">

                    <button type="button" class="password-toggle" onclick="togglePassword('new_password', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <div class="password-input">

                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Confirm new password" required minlength="8" autocomplete="new-password">

                    <button type="button" class="password-toggle" onclick="togglePassword('confirm_password', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>


            <button type="submit" class="password-btn">

                <i class="fa-solid fa-key"></i>

                Change Password

            </button>

        </form>


        <a href="{{ url_for('auth.account') }}" class="back-account">

            <i class="fa-solid fa-arrow-left"></i>

            Back to My Account

        </a>

    </div>

</div>


<script>

    function togglePassword(inputId, button) {

        const input = document.getElementById(inputId);

        const icon = button.querySelector("i");

        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        } else {

            input.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

        }

    }

</script>

{% endblock %}
