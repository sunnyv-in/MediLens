{% extends "layouts/base.html" %}
{% block title %}Reset Password | MediLens{% endblock %}

{% block css %}
<style>
  .auth-simple-page {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .auth-simple-card {
    width: 100%;
    max-width: 460px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 40px 36px;
    box-shadow: var(--shadow-lg);
  }
  .auth-icon-ring {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: rgba(20,184,166,0.12);
    border: 1px solid rgba(20,184,166,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.75rem; color: var(--primary);
    margin: 0 auto 20px;
  }
  .auth-simple-card h1 {
    text-align: center; font-size: 1.6rem; font-weight: 700;
    font-family: var(--font-display); color: var(--text-primary);
    margin: 0 0 10px;
  }
  .auth-simple-card .subtitle {
    text-align: center; color: var(--text-muted); font-size: 0.95rem;
    line-height: 1.6; margin-bottom: 28px;
  }
  .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .form-field label {
    font-size: 0.875rem; font-weight: 600; color: var(--text-secondary);
  }
  .form-field input {
    min-height: 50px; width: 100%;
    background: var(--bg-surface); border: 1.5px solid var(--border-subtle);
    border-radius: var(--radius-md); padding: 12px 16px;
    font-size: 1rem; color: var(--text-primary); font-family: var(--font-body);
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .form-field input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }
  .btn-submit {
    width: 100%; min-height: 52px;
    background: var(--primary); color: #fff; border: none;
    border-radius: var(--radius-md); font-size: 1rem; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-top: 8px;
    transition: background var(--transition-fast), transform var(--transition-fast);
  }
  .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .back-link {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 20px; color: var(--text-muted); text-decoration: none;
    font-size: 0.9rem; font-weight: 500;
    transition: color var(--transition-fast);
  }
  .back-link:hover { color: var(--primary); }
</style>
{% endblock %}

{% block content %}
<div class="auth-simple-page">
  <div class="auth-simple-card">

    <div class="auth-icon-ring">
      <i class="fa-solid fa-key"></i>
    </div>

    <h1>Reset Password</h1>
    <p class="subtitle">Enter your account email address and we'll send you instructions to reset your password.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
          placeholder="Enter your email address"
          required autocomplete="email">
      </div>
      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-paper-plane"></i>
        Send Reset Instructions
      </button>
    </form>

    <a href="{{ url_for('auth.account') }}" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to My Account
    </a>

  </div>
</div>
{% endblock %}
