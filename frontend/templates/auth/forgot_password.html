{% extends "layouts/base.html" %}


{% block title %}
Reset Password | MediLens
{% endblock %}


{% block css %}

<style>
    .password-page {
        max-width: 520px;
        margin: 70px auto;
        padding: 20px;
    }

    .password-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .password-header .icon {
        width: 70px;
        height: 70px;

        margin: 0 auto 20px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(37, 99, 235, 0.15);

        color: #4f8cff;

        font-size: 28px;
    }

    .password-header h1 {
        margin-bottom: 10px;
    }

    .password-header p {
        opacity: 0.7;
        line-height: 1.6;
    }

    .password-card {
        padding: 30px;

        border-radius: 20px;

        background: rgba(255, 255, 255, 0.05);

        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;

        margin-bottom: 8px;

        font-weight: 600;
    }

    .form-group input {
        width: 100%;

        box-sizing: border-box;

        padding: 13px 15px;

        border-radius: 10px;

        border: 1px solid rgba(255, 255, 255, 0.15);

        background: rgba(255, 255, 255, 0.05);

        color: inherit;

        outline: none;
    }

    .form-group input:focus {
        border-color: #2563eb;
    }

    .password-btn {
        width: 100%;

        border: none;

        padding: 13px;

        border-radius: 10px;

        background: #2563eb;

        color: white;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;
    }

    .password-btn:hover {
        opacity: 0.9;
    }

    .back-account {
        display: block;

        text-align: center;

        margin-top: 20px;

        color: #4f8cff;

        text-decoration: none;
    }
</style>

{% endblock %}


{% block content %}

<div class="password-page">

    <div class="password-header">

        <div class="icon">

            <i class="fa-solid fa-key"></i>

        </div>

        <h1>
            Reset Password
        </h1>

        <p>
            Enter the email address associated with
            your MediLens account.
        </p>

    </div>


    <div class="password-card">

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input type="email" id="email" name="email" placeholder="Enter your email" required
                    autocomplete="email">

            </div>


            <button type="submit" class="password-btn">

                <i class="fa-solid fa-paper-plane"></i>

                Send Reset Instructions

            </button>

        </form>


        <a href="{{ url_for('auth.account') }}" class="back-account">

            <i class="fa-solid fa-arrow-left"></i>

            Back to My Account

        </a>

    </div>

</div>

{% endblock %}
