{% extends "layouts/base.html" %}

{% block title %}
Login | MediLens
{% endblock %}

{% block css %}
<style>
    .auth-page {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .auth-card {
        width: 420px;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
    }

    .auth-card h1 {
        margin-bottom: 8px;
    }

    .auth-card p {
        color: #64748b;
        margin-bottom: 28px;
    }

    .auth-group {
        margin-bottom: 18px;
    }

    .auth-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
    }

    .auth-group input {
        width: 100%;
        padding: 13px;
        border: 1px solid #dbe2ea;
        border-radius: 10px;
        box-sizing: border-box;
    }

    .auth-btn {
        width: 100%;
        border: none;
        padding: 14px;
        background: #2563eb;
        color: white;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
    }

    .auth-links {
        text-align: center;
        margin-top: 20px;
    }

    .guest-btn {
        display: block;
        text-align: center;
        margin-top: 15px;
        padding: 12px;
        border: 1px solid #2563eb;
        color: #2563eb;
        border-radius: 10px;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>
            Login to save your MediLens data permanently.
        </p>

        <form method="POST">

            <div class="auth-group">
                <label>Email</label>

                <input type="email" name="email" required>
            </div>

            <div class="auth-group">
                <label>Password</label>

                <input type="password" name="password" required>
            </div>

            <button class="auth-btn">
                Sign In
            </button>

        </form>

        <div class="auth-links">

            <p>
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">
                    Create Account
                </a>
            </p>

            <a class="guest-btn" href="{{ url_for('auth.guest') }}">
                Continue as Guest
            </a>

        </div>

    </div>

</div>

{% endblock %}
