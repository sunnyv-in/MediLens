{% extends "layouts/base.html" %}

{% block title %}
Create Account | MediLens
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>
            Save your medicines, history and reminders.
        </p>

        <form method="POST">

            <div class="auth-group">
                <label>Name</label>

                <input type="text" name="name" required>
            </div>

            <div class="auth-group">
                <label>Email</label>

                <input type="email" name="email" required>
            </div>

            <div class="auth-group">
                <label>Password</label>

                <input type="password" name="password" minlength="6" required>
            </div>

            <button class="auth-btn">
                Create Account
            </button>

        </form>

        <div class="auth-links">

            <p>
                Already have an account?
                <a href="{{ url_for('auth.login') }}">
                    Login
                </a>
            </p>

            <a class="guest-btn" href="{{ url_for('auth.guest') }}">
                Continue as Guest
            </a>

        </div>

    </div>

</div>

{% endblock %}
